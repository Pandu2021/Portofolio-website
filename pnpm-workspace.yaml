# =============================================================================
# pnpm-workspace.yaml — monorepo layout, shared versions and install security.
# =============================================================================

# Every folder in apps/, packages/ and tools/ is a workspace package.
# tools/ holds local tooling (e.g. the promo video) that is never published.
packages:
  - apps/*
  - packages/*
  - tools/*

# Single source of truth for shared dependency versions ("catalog:" protocol).
# TypeScript stays on 6.0.x: Angular 22 and typescript-eslint require < 6.1.
# ESLint stays on 9.x: eslint-config-next plugins do not support ESLint 10 yet.
catalog:
  '@eslint/js': 9.39.5
  '@fontsource-variable/jetbrains-mono': 5.3.0
  '@fontsource-variable/plus-jakarta-sans': 5.3.0
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  eslint: 9.39.5
  globals: 17.14.0
  jsdom: 31.0.0
  prettier: 3.9.10
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vitest: 5.1.0
  # Vue demo (apps/vue-invoice). eslint-plugin-vue stays on 10.12.0 until
  # 10.12.1 is older than minimumReleaseAge.
  '@vitejs/plugin-vue': 6.0.10
  '@vue/devtools-api': 8.2.1
  '@vue/test-utils': 2.5.1
  eslint-plugin-vue: 10.12.0
  pinia: 4.1.0
  vue: 3.5.45
  vue-router: 5.4.0
  vue-tsc: 3.3.14
  # Promo video (tools/promo-video), rendered locally only.
  '@remotion/bundler': 4.0.542
  '@remotion/renderer': 4.0.542
  remotion: 4.0.542

# Supply-chain hardening: dependency install scripts are blocked by default.
# None of these need their scripts for our build (prebuilt binaries are used).
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

# Supply-chain hardening: ignore package versions published less than 24 h ago
# (most malicious releases are detected and pulled within hours).
minimumReleaseAge: 1440
