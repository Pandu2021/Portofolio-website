# =============================================================================
# pnpm-workspace.yaml — monorepo layout, shared versions and install security.
# =============================================================================

# Every folder in apps/ and packages/ is a workspace package.
packages:
  - apps/*
  - packages/*

# Single source of truth for shared dependency versions ("catalog:" protocol).
# TypeScript stays on 6.0.x: Angular 22 and typescript-eslint require < 6.1.
# ESLint stays on 9.x: eslint-config-next plugins do not support ESLint 10 yet.
catalog:
  '@eslint/js': 9.39.5
  '@fontsource-variable/jetbrains-mono': 5.3.0
  '@fontsource-variable/plus-jakarta-sans': 5.3.0
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  eslint: 9.39.5
  globals: 17.14.0
  jsdom: 30.1.3
  prettier: 3.9.10
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vitest: 5.1.0

# Supply-chain hardening: dependency install scripts are blocked by default.
# None of these need their scripts for our build (prebuilt binaries are used).
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

# Supply-chain hardening: ignore package versions published less than 24 h ago
# (most malicious releases are detected and pulled within hours).
minimumReleaseAge: 1440
